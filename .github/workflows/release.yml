name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the public release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: git clone --depth 1 --branch "$RELEASE_TAG" "https://github.com/$GITHUB_REPOSITORY.git" .
      - name: Build code and data archives
        run: python3 scripts/package_release.py --output-dir dist
      - name: Publish Findings of EMNLP release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/codemia-code.tar.gz dist/codemia-data.tar.gz dist/checksums.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "CodeMIA $RELEASE_TAG — Findings of EMNLP 2026" \
            --notes-file docs/RELEASE_NOTES.md
